name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Les tests d'intégration Kafka utilisent @EmbeddedKafka (broker embarqué
      # dans la JVM de test) : aucun service Docker n'est nécessaire en CI.
      - name: Build & tests
        run: mvn -B clean test
