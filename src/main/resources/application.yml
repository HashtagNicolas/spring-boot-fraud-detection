# Configuration de l'application "détection de fraude en temps réel".

spring:
  application:
    name: fraud-detection

  kafka:
    # En production/développement : localhost:9092.
    # En test, la propriété "spring.embedded.kafka.brokers" est injectée
    # automatiquement par @EmbeddedKafka (spring-kafka-test) et prend le
    # dessus grâce au mécanisme de valeur par défaut ci-dessous.
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

    producer:
      # Clé de message : simple chaîne de caractères (ex. identifiant de compte)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Valeur de message : événement métier sérialisé en JSON
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: fraud-detection-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Désérialisation basée sur l'en-tête Kafka __TypeId__, ajouté
        # automatiquement à la production par JsonSerializer (comportement
        # par défaut, non désactivé côté producteur). Indispensable dès lors
        # que plusieurs types d'événements transitent sur des topics
        # consommés par la même JVM (Transaction sur "transactions", puis
        # FraudAlert produite en retour sur "fraud-alerts") : un unique type
        # par défaut ne suffirait plus à désambiguïser. trusted.packages
        # reste nécessaire : c'est la mesure de sécurité de JsonDeserializer
        # qui limite les classes que l'en-tête est autorisé à instancier.
        spring.json.trusted.packages: com.hashtag.ngo.example.fraud.entity

  # Base de données H2 embarquée, utilisée pour stocker les cas de fraude détectés
  datasource:
    url: jdbc:h2:mem:frauddb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    # Désactivé pour éviter que la session Hibernate ne reste ouverte
    # jusqu'au rendu de la vue (non pertinent pour une API REST).
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

# Noms des topics Kafka, externalisés pour ne pas les coder en dur dans les
# classes Java (KafkaTopicsConfig les lit pour créer les topics au démarrage).
app:
  kafka:
    topics:
      transactions: transactions
      fraud-alerts: fraud-alerts
      fraud-alerts-dlt: fraud-alerts.DLT

  security:
    jwt:
      # Secret HMAC utilisé pour signer/valider les JWT (JwtServiceImpl).
      # ATTENTION : valeur de démonstration en clair dans ce fichier, à
      # CHANGER EN PRODUCTION - à externaliser via une variable d'environnement
      # ou un coffre-fort de secrets (Vault, AWS Secrets Manager...), jamais
      # committée en clair dans le contrôle de version.
      secret: "changeit-ceci-est-un-secret-de-demonstration-a-remplacer-en-production-0123456789"
      expiration-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
